<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Finn Planning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:wght@700;900&family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&family=Karla:wght@400;600;800&display=swap">
<style>
/* Finn-only planning page for the merch items (one tab per item). The page follows the version tab:
   Pretty = pink, Killer = black (shared items show on both). */
:root{
  --ground:#f8d2e1; --surface:#fffafc; --ink:#161015; --muted:#8e5a73;
  --accent:#f25fc4; --accent-ink:#161015; --line:#e9b1c9;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Karla",system-ui,sans-serif;
  --mono:"Special Elite","Courier New",monospace;
  --radius:3px; --shadow:0 18px 28px -14px rgba(120,30,75,.45);
  color-scheme:light;
}
:root[data-side="killer"]{
  --ground:#09080a; --surface:#141216; --ink:#f2ecf0; --muted:#8c8390;
  --accent:#ff3fae; --accent-ink:#0a0a0a; --line:#2c272f;
  --display:"Anton","Impact",sans-serif;
  --body:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:0px; --shadow:6px 6px 0 0 #ff3fae;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh;transition:background .3s,color .3s}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 56px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;flex-wrap:wrap}
.bar b{font:900 20px/1 var(--display)}
[data-side="killer"] .bar b{font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.private{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.12em;background:var(--ink);color:var(--ground);padding:6px 10px;border-radius:var(--radius)}
.eyebrow{font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
h1{margin:8px 0 4px;font:900 clamp(40px,9vw,80px)/.95 var(--display)}
[data-side="killer"] h1{font-weight:400;text-transform:uppercase;color:var(--accent)}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 22px}
.meta span{font:600 13px var(--mono);background:var(--surface);padding:8px 12px;border-radius:var(--radius);box-shadow:var(--shadow)}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.ptabs{display:flex;gap:6px;margin:4px 0 24px;border-bottom:2px solid var(--line);flex-wrap:wrap}
.ptab{font:900 18px/1 var(--display);padding:12px 14px;min-height:44px;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;color:var(--muted);cursor:pointer}
[data-side="killer"] .ptab{font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.ptab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab{font:600 14px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:12px 18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:var(--radius)}
.tab[data-v="killer"]{background:#0b0a0c;color:#ff3fae;border-color:#2c272f}
.tab[data-v="pretty"]{background:#fffafc;color:#161015;border-color:#e9b1c9}
.tab[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;font:600 13px var(--mono);color:var(--muted)}
.progress .track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;background:var(--surface);padding:16px 18px;border-radius:var(--radius);box-shadow:var(--shadow)}
.item input{width:22px;height:22px;margin-top:3px;accent-color:var(--accent);cursor:pointer}
.item h3{margin:0;font:900 22px/1.15 var(--display)}
[data-side="killer"] .item h3{font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.item p{margin:4px 0 0;color:var(--muted);font-size:15px}
.item .qty{font:600 13px var(--mono);color:var(--accent);white-space:nowrap;text-align:right}
.item .tag{display:inline-block;margin-top:6px;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:var(--radius)}
.item.done h3{text-decoration:line-through;opacity:.55}
.item.tba h3{font-style:italic;opacity:.5}
.empty{text-align:center;padding:40px 16px;background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
.foot{margin-top:24px;font:12px var(--mono);color:var(--muted)}
h2{margin:40px 0 6px;font:900 34px/1.1 var(--display)}
[data-side="killer"] h2{font-weight:400;text-transform:uppercase;color:var(--accent)}
.pb-sum{margin:0 0 14px;color:var(--muted)}
.pages{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pages span{font:600 13px var(--mono);background:var(--surface);padding:8px 12px;border-radius:var(--radius);box-shadow:var(--shadow)}
.pages b{color:var(--accent)}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.song{display:flex;align-items:center;gap:10px;background:var(--surface);padding:10px 14px;border-radius:var(--radius);cursor:pointer}
.song input{width:20px;height:20px;accent-color:var(--accent)}
.song .no{font:600 12px var(--mono);color:var(--muted);min-width:22px}
.song .nm{flex:1;font-weight:700}
.song .pg{font:600 12px var(--mono);color:var(--accent)}
.song.done .nm{text-decoration:line-through;opacity:.55}
.song.tba .nm{font-style:italic;opacity:.5;font-weight:400}
.part{grid-column:1/-1;margin:14px 0 2px;font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.song.extra .nm{font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar"><b>Finn Planning</b><span class="private">Just for Finn</span></header>
  <div class="ptabs" id="ptabs" role="tablist" aria-label="Item"></div>
  <span class="eyebrow" id="eyebrow"></span>
  <h1 id="name"></h1>
  <div class="meta" id="meta"></div>
  <div class="tabs" id="tabs" role="group" aria-label="Version"></div>
  <div class="progress"><span id="count"></span><span class="track"><i id="fill"></i></span></div>
  <div class="list" id="list"></div>
  <section id="pb">
    <h2>Photobook</h2>
    <p class="pb-sum" id="pbSum"></p>
    <div class="pages" id="pbPages"></div>
    <div class="songs" id="pbSongs"></div>
  </section>
  <p class="foot">Ticking an item marks it ready. The ticks are saved on this device only.</p>
</div>

<script>
/* =====================================================================
   WHAT'S INSIDE, one entry per item (each gets a tab). Edit these lists.
   versions: the version tabs. Items with side "both" show on every version.
   Each item: name, note (optional), qty (optional), side ("pretty" / "killer" / "both").
   An item with tba: true shows as "To be announced".
   photobook: true adds the Photobook section (23 pages per song, see PHOTOBOOK).
   ===================================================================== */
const PRODUCTS = [
  {
    id: "kpopcd",
    name: "K-pop Style CD",
    meta: ["$45", "Pretty ver. + Killer ver.", "Pre-order · after the show"],
    versions: [ { key:"pretty", label:"Pretty ver." }, { key:"killer", label:"Killer ver." } ],
    photobook: true,
    items: [
      { side:"both", name:"CD", note:"The album" },
      { side:"both", name:"Photobook", note:"Start page, then 3 parts: an outfit page and 5 songs (23 pages each) per part (see below)" },
      { side:"both", name:"Lenticular card" },
      { side:"both", name:"Charm" },
      { side:"both", name:"Photocards", qty:"2" },
      { side:"both", name:"Stickers" },
      { side:"both", name:"Pokémon-style card" },
      { side:"both", name:"Scratch-off" }
    ]
  },
  {
    id: "book",
    name: "Pretty Killer Tour Book",
    meta: ["$45", "Hardcover", "One version", "Pre-order · after the show"],
    versions: [ { key:"both", label:"Tour Book" } ],
    items: [
      { side:"both", name:"Hardcover", note:"The cover" },
      { side:"both", tba:true },
      { side:"both", tba:true },
      { side:"both", tba:true }
    ]
  }
];

/* PHOTOBOOK (from "CD K-pop Final"): a start page, then 3 parts. Each part is an outfit page
   and 5 songs, 23 pages per song. That's the 15 songs on that version's side of the tracklist
   (part 1 = songs 1-5, part 2 = 6-10, part 3 = 11-15). Song names come from the tracklist. */
const PHOTOBOOK = {
  perSong: [ { n:18, what:"photos" }, { n:2, what:"behind the scenes" }, { n:1, what:"lyrics page" }, { n:1, what:"backstory page" }, { n:1, what:"poster" } ],
  start: 1,          // start page
  parts: 3,
  songsPerPart: 5,
  outfitPerPart: 1   // outfit page at the start of each part
};
let tracks = { pretty:[], killer:[] };

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
let PRODUCT, done, v;
const KEY = () => `pk-contents-${PRODUCT.id}`;
const save = () => { try { localStorage.setItem(KEY(), JSON.stringify(done)); } catch(e){} };
$("#ptabs").innerHTML = PRODUCTS.map(p => `<button class="ptab" type="button" role="tab" data-p="${p.id}">${esc(p.name)}</button>`).join("");
function openProduct(id){
  PRODUCT = PRODUCTS.find(p => p.id === id) || PRODUCTS[0];
  done = {}; try { done = JSON.parse(localStorage.getItem(KEY())) || {}; } catch(e){}
  v = PRODUCT.versions[0].key;
  history.replaceState(null, "", "#" + PRODUCT.id);
  document.querySelectorAll("[data-p]").forEach(b => b.setAttribute("aria-selected", b.dataset.p === PRODUCT.id));
  $("#name").textContent = PRODUCT.name;
  $("#eyebrow").textContent = "Contents · Pretty Killer Tour";
  $("#meta").innerHTML = PRODUCT.meta.map(m => `<span>${esc(m)}</span>`).join("");
  $("#tabs").hidden = PRODUCT.versions.length < 2;
  $("#tabs").innerHTML = PRODUCT.versions.map(x => `<button class="tab" type="button" data-v="${x.key}">${esc(x.label)}</button>`).join("");
  $("#pb").hidden = !PRODUCT.photobook;
  render();
}

function render(){
  document.documentElement.dataset.side = v === "killer" ? "killer" : "pretty";
  document.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  const items = PRODUCT.items.map((it, i) => ({ ...it, key:`${i}:${it.side === "both" ? "both" : v}` }))
    .filter(it => it.side === "both" || it.side === v || PRODUCT.versions.length < 2);
  const n = items.filter(it => done[it.key]).length;
  $("#count").textContent = `${n} of ${items.length} ready`;
  $("#fill").style.width = items.length ? `${n / items.length * 100}%` : "0";
  $("#list").innerHTML = items.length ? items.map(it => `<label class="item${done[it.key] ? " done" : ""}${it.tba ? " tba" : ""}">
      <input type="checkbox" data-k="${esc(it.key)}" ${done[it.key] ? "checked" : ""}>
      <div><h3>${it.tba ? "To be announced" : esc(it.name)}</h3>${it.note ? `<p>${esc(it.note)}</p>` : ""}${PRODUCT.versions.length > 1 && it.side === "both" ? `<span class="tag">Both versions</span>` : ""}</div>
      <span class="qty">${it.qty ? "× " + esc(it.qty) : ""}</span>
    </label>`).join("") : `<div class="empty">Nothing listed yet.</div>`;
  renderPhotobook();
}
function renderPhotobook(){
  if (!PRODUCT.photobook) return;
  const P = PHOTOBOOK, per = P.perSong.reduce((a, x) => a + x.n, 0);
  const songs = P.parts * P.songsPerPart, total = P.start + P.parts * (P.outfitPerPart + P.songsPerPart * per);
  $("#pbSum").textContent = `${v === "killer" ? "Killer" : "Pretty"} ver.: ${P.start} start page + ${P.parts} parts × (${P.outfitPerPart} outfit page + ${P.songsPerPart} songs × ${per} pages) = ${total} pages.`;
  $("#pbPages").innerHTML = P.perSong.map(x => `<span><b>${x.n}</b> ${esc(x.what)}</span>`).join("") + `<span>= ${per} pages per song</span>`;
  const row = (k, no, name, pages, cls = "") => `<label class="song${cls}${done[k] ? " done" : ""}"><input type="checkbox" data-k="${k}" ${done[k] ? "checked" : ""}>
      <span class="no">${no}</span><span class="nm">${name}</span><span class="pg">${pages} page${pages === 1 ? "" : "s"}</span></label>`;
  let html = row(`pb:${v}:start`, "★", "Start page", P.start, " extra");
  for (let part = 0; part < P.parts; part++){
    html += `<div class="part">Part ${part + 1}</div>` + row(`pb:${v}:outfit${part + 1}`, "+", "Outfit page", P.outfitPerPart, " extra");
    for (let s = 0; s < P.songsPerPart; s++){
      const i = part * P.songsPerPart + s, n = (tracks[v][i] || "").trim();
      html += row(`pb:${v}:${i}`, String(i + 1).padStart(2, "0"), n ? esc(n) : "To be announced", per, n ? "" : " tba");
    }
  }
  $("#pbSongs").innerHTML = html;
}
// song names from the tracklist (public read)
fetch("https://firestore.googleapis.com/v1/projects/finn-pretty-killer-tix/databases/(default)/documents/tracklist/prettykiller")
  .then(r => r.json()).then(d => {
    const f = d.fields || {}, list = side => ((f[side] && f[side].arrayValue.values) || []).map(x => x.stringValue || "");
    tracks = { pretty: list("pretty"), killer: list("killer") }; renderPhotobook();
  }).catch(() => {});
document.addEventListener("click", e => {
  const p = e.target.closest("[data-p]"); if (p) return openProduct(p.dataset.p);
  const b = e.target.closest("[data-v]"); if (b){ v = b.dataset.v; render(); }
});
document.addEventListener("change", e => { const c = e.target.closest("[data-k]"); if (!c) return; c.checked ? done[c.dataset.k] = true : delete done[c.dataset.k]; save(); render(); });
openProduct(location.hash.slice(1));
</script>
</body>
</html>
