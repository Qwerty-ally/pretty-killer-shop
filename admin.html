<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Shop Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#09080a; --surface:#141216; --surface-2:#1d1a20; --ink:#f2ecf0; --muted:#8c8390; --line:#2c272f;
  --accent:#ff3fae; --ok:#5fd39a;
  --display:"Anton",Impact,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--mono);padding:24px 16px 48px}
.wrap{max-width:980px;margin:0 auto}
h1{margin:0;font:400 clamp(32px,7vw,52px)/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
h1 span{color:var(--accent)}
.label{font:600 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.status{font-size:12px;color:var(--muted)}
input,button{font:inherit;color:inherit}
input{background:var(--surface);border:1.5px solid var(--line);padding:10px 12px;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:#0a0a0a;border:0;padding:11px 16px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;font-size:13px}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.login{max-width:420px;background:var(--surface);border:1.5px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:10px}
.err{color:var(--accent);font-size:13px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1.5px solid var(--line);padding:12px 14px}
.stat b{display:block;font:400 30px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools input{flex:1 1 220px}
.tools label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.orders{display:flex;flex-direction:column;gap:10px}
.order{background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--accent);padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 18px;align-items:start}
.order.new{animation:flash 1.6s ease-out 2}
@keyframes flash{50%{background:#2a1424}}
.order.done{border-left-color:var(--ok);opacity:.55}
.num{font:400 30px/1 var(--display);color:var(--accent);letter-spacing:.03em}
.order.done .num{color:var(--ok)}
.who b{font-size:17px}
.who .label{display:block;margin-top:2px}
.items{grid-column:2 / 3;margin:4px 0 0;padding:0;list-style:none;font-size:14px}
.items li::before{content:"· ";color:var(--accent)}
.right{text-align:right;display:flex;flex-direction:column;gap:8px;align-items:end}
.total{font-weight:600;font-variant-numeric:tabular-nums}
.pick{display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer;white-space:nowrap}
.pick input{width:18px;height:18px;accent-color:var(--ok)}
.empty{color:var(--muted);padding:30px 0;text-align:center}
.badge{display:inline-block;margin-left:8px;padding:2px 7px;font:600 10px/1.4 var(--mono);text-transform:uppercase;letter-spacing:.1em;background:#2a2230;color:#ffd166;border:1px solid #4a3d22;vertical-align:middle}
.note{grid-column:2 / 3;font-size:13px;color:var(--muted);margin:0}
.rm{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px}
/* add an in-person sale */
.sale{background:var(--surface);border:1.5px solid var(--accent);padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.sale h2{margin:0;font:400 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
.sale .row{display:flex;gap:10px;flex-wrap:wrap}
.sale .row > *{flex:1 1 160px}
.sale label.f{display:flex;flex-direction:column;gap:4px}
select{background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink);padding:10px 12px;font:inherit;min-width:0}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) 60px 112px 80px auto;gap:8px;align-items:center;background:var(--surface-2);padding:8px}
.line input,.line select{width:100%}
.line .amt{text-align:right;font-variant-numeric:tabular-nums}
.line .each{display:flex;align-items:center;gap:2px}
.line .each input.off{border-color:#ffd166;color:#ffd166}
.line .was{grid-column:1 / -1;font-size:12px;color:#ffd166;margin:-2px 0 0}
.line .x{background:none;border:1.5px solid var(--line);color:var(--muted);width:36px;height:36px;cursor:pointer}
.sale .sum{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sale .sum b{font:400 28px/1 var(--display)}
@media (max-width:600px){ .line{grid-template-columns:1fr 1fr 1fr} .line > select:first-child{grid-column:1 / -1} .line .amt{text-align:left} }
@media (max-width:600px){
  .order{grid-template-columns:1fr auto}
  .who{grid-column:1 / -1;grid-row:2}
  .items{grid-column:1 / -1}
  .right{grid-column:2;grid-row:1}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><div class="label">Pretty Killer Shop · Admin</div><h1>Orders <span id="count"></span></h1></div>
    <div class="status" id="status"></div>
  </div>

  <form class="login" id="login">
    <label class="label" for="pw">Admin password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Open orders</button>
    <p class="err" id="loginErr" hidden></p>
  </form>

  <div id="board" hidden>
    <div class="stats">
      <div class="stat"><span class="label">Orders</span><b id="sOrders">0</b></div>
      <div class="stat"><span class="label">To order</span><b id="sToOrder">0</b></div>
      <div class="stat"><span class="label">To pick up</span><b id="sWaiting">0</b></div>
      <div class="stat"><span class="label">Sales</span><b id="sSales">$0</b></div>
      <div class="stat"><span class="label">In person</span><b id="sInPerson">$0</b></div>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="Search name or order number" aria-label="Search orders">
      <label><input type="checkbox" id="hideDone"> Hide picked up</label>
      <button class="btn ghost" type="button" id="refresh">Refresh</button>
      <button class="btn" type="button" id="addSale">+ In-person sale</button>
      <button class="btn ghost" type="button" id="logout">Log out</button>
    </div>
    <form class="sale" id="sale" hidden>
      <h2>Add an in-person sale</h2>
      <div class="row">
        <label class="f"><span class="label">Buyer's name</span><input id="saleName" maxlength="60" placeholder="Name (optional)"></label>
        <label class="f"><span class="label">Paid with</span><select id="saleMethod"></select></label>
      </div>
      <div class="lines" id="saleLines"></div>
      <div class="row"><button class="btn ghost" type="button" id="addLine" style="flex:0 0 auto">+ Add an item</button></div>
      <label class="f"><span class="label">Note</span><input id="saleNote" maxlength="200" placeholder="Optional, like 'paid $40, gave $5 back'"></label>
      <div class="sum"><span class="label">Total</span><b id="saleTotal">$0.00</b></div>
      <p class="err" id="saleErr" hidden></p>
      <div class="row"><button class="btn" type="submit" id="saveSale">Save sale</button><button class="btn ghost" type="button" id="cancelSale">Cancel</button></div>
    </form>
    <div class="orders" id="orders"></div>
  </div>
</div>

<script>
const ORDERS_URL = "https://pretty-killer-checkout.vercel.app/api/orders";
const MANUAL_URL = "https://pretty-killer-checkout.vercel.app/api/manual";   // in-person sales
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const money = c => "$" + (c / 100).toFixed(2);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

// the private admin link (admin.html#<ADMIN_KEY>) opens the orders with no password to type
const linkKey = decodeURIComponent(location.hash.slice(1)).trim();
if (linkKey) store.set("pk-admin-pw", linkKey);
let pw = store.get("pk-admin-pw", ""), orders = [], seen = new Set(store.get("pk-admin-seen", [])), firstLoad = true;
// "picked up" is saved on this device only
const done = new Set(store.get("pk-admin-done", []));
// "ordered": you've ordered or made what's in it (also saved on this device only)
const ordered = new Set(store.get("pk-admin-ordered", []));
let timer;

async function load(){
  $("#status").textContent = "Loading…";
  try {
    const r = await fetch(ORDERS_URL, { headers: { "X-Admin-Key": pw }, cache: "no-store" });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401){ return logout("Wrong password."); }
    if (!r.ok) throw new Error(data.error || "Couldn't load orders.");
    orders = data.orders || [];
    $("#login").hidden = true; $("#board").hidden = false;
    render();
    $("#status").textContent = "Updated " + new Date().toLocaleTimeString([], { hour:"numeric", minute:"2-digit", second:"2-digit" }) + " · checks every 15 seconds";
  } catch(e){
    $("#status").textContent = e.message + " Trying again soon.";
  }
}

function render(){
  const q = $("#search").value.trim().toLowerCase(), hide = $("#hideDone").checked;
  const fresh = firstLoad ? new Set() : new Set(orders.map(o => o.order).filter(n => !seen.has(n)));
  orders.forEach(o => seen.add(o.order)); store.set("pk-admin-seen", [...seen].slice(-1000));
  if (fresh.size && !firstLoad) document.title = `(${fresh.size} new) Shop Orders`;
  firstLoad = false;

  $("#count").textContent = orders.length ? `· ${orders.length}` : "";
  $("#sOrders").textContent = orders.length;
  $("#sWaiting").textContent = orders.filter(o => !done.has(o.order)).length;
  $("#sToOrder").textContent = orders.filter(o => !ordered.has(o.order) && !done.has(o.order)).length;
  $("#sSales").textContent = money(orders.reduce((a, o) => a + o.total, 0));
  $("#sInPerson").textContent = money(orders.filter(o => o.manual).reduce((a, o) => a + o.total, 0));

  const list = orders.filter(o => (!hide || !done.has(o.order)) && (!q || `${o.name} ${o.order}`.toLowerCase().includes(q)));
  $("#orders").innerHTML = list.length ? list.map(o => {
    const isDone = done.has(o.order), when = new Date(o.created);
    return `<article class="order ${isDone ? "done" : ""} ${fresh.has(o.order) ? "new" : ""}">
      <div class="num">${esc(o.order || "—")}</div>
      <div class="who"><b>${esc(o.name || "(no name)")}</b>${o.manual ? `<span class="badge">In person · ${esc(o.method || "Cash")}</span>` : ""}<span class="label">${when.toLocaleDateString([], { month:"short", day:"numeric" })} · ${when.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" })}${o.email ? " · " + esc(o.email) : ""}</span></div>
      <div class="right"><span class="total">${money(o.total)}</span>
        <label class="pick"><input type="checkbox" data-ordered="${esc(o.order)}" ${ordered.has(o.order) || isDone ? "checked" : ""}> Ordered</label>
        <label class="pick"><input type="checkbox" data-done="${esc(o.order)}" ${isDone ? "checked" : ""}> Picked up</label></div>
      <ul class="items">${o.items.map(i => `<li>${i.qty} × ${esc(i.name)}</li>`).join("")}${o.freeMovie ? "<li>1 × Pretty Killer: The Movie (secret code, free)</li>" : ""}</ul>
      ${o.note ? `<p class="note">Note: ${esc(o.note)}</p>` : ""}
      ${o.manual ? `<p class="note"><button class="rm" type="button" data-rm="${esc(o.id)}">Remove this sale</button></p>` : ""}
    </article>`;
  }).join("") : `<p class="empty">${orders.length ? "No orders match." : "No orders yet."}</p>`;
}

function logout(msg){
  clearInterval(timer); pw = ""; store.set("pk-admin-pw", "");
  $("#board").hidden = true; $("#login").hidden = false;
  $("#loginErr").textContent = msg || ""; $("#loginErr").hidden = !msg;
  $("#status").textContent = "";
}
function start(){ load(); clearInterval(timer); timer = setInterval(load, 15000); }

/* ---------- in-person sales ----------
   Saved by the checkout server as Stripe invoices marked "paid outside of Stripe": nobody is
   charged or emailed. They show in the list with an "In person" badge and count in Sales. */
let catalog = null, methods = [], saleLines = [];
async function openSale(){
  $("#saleErr").hidden = true;
  if (!catalog){
    try {
      const r = await fetch(MANUAL_URL, { headers: { "X-Admin-Key": pw }, cache: "no-store" });
      const d = await r.json(); if (!r.ok) throw new Error(d.error || "");
      catalog = d.items; methods = d.methods;
    } catch(e){ $("#status").textContent = "The sale form didn't load. Try again."; return; }
    $("#saleMethod").innerHTML = methods.map(m => `<option>${esc(m)}</option>`).join("");
  }
  saleLines = [{ id: catalog[0].id, side: "pretty", qty: 1 }];
  $("#saleName").value = ""; $("#saleNote").value = "";
  renderLines(); $("#sale").hidden = false; $("#saleName").focus();
}
const itemOf = l => catalog.find(c => c.id === l.id);
// l.price is what you typed (dollars); empty means the normal price for list items
const linePrice = l => l.price !== undefined && l.price !== "" ? Math.round((parseFloat(l.price) || 0) * 100) : l.id === "custom" ? 0 : itemOf(l).price;
function renderLines(){
  $("#saleLines").innerHTML = saleLines.map((l, i) => {
    const it = l.id === "custom" ? null : itemOf(l);
    return `<div class="line">
      <select data-f="id" data-i="${i}" aria-label="Item">${catalog.map(c => `<option value="${c.id}" ${c.id === l.id ? "selected" : ""}>${esc(c.name)} · ${money(c.price)}</option>`).join("")}<option value="custom" ${l.id === "custom" ? "selected" : ""}>Something else…</option></select>
      ${l.id === "custom"
        ? `<input data-f="name" data-i="${i}" placeholder="What" value="${esc(l.name || "")}" aria-label="What was sold">`
        : it.variants ? `<select data-f="side" data-i="${i}" aria-label="Version">${Object.entries(it.variants).map(([k, v]) => `<option value="${k}" ${k === l.side ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>` : `<span class="label">One version</span>`}
      <input data-f="qty" data-i="${i}" type="number" min="1" max="50" value="${l.qty}" aria-label="How many">
      <span class="each">$<input data-f="price" data-i="${i}" type="number" min="0" step="0.01" placeholder="${it ? (it.price / 100).toFixed(2) : "each"}" value="${esc(l.price ?? (it ? (it.price / 100).toFixed(2) : ""))}" aria-label="Price each" class="${it && linePrice(l) !== it.price ? "off" : ""}"></span>
      <span class="amt" data-amt="${i}">${money(linePrice(l) * l.qty)}</span>
      <button class="x" type="button" data-x="${i}" aria-label="Remove item" ${saleLines.length < 2 ? "disabled" : ""}>×</button>
      <p class="was" data-was="${i}" ${it && linePrice(l) !== it.price ? "" : "hidden"}>${it ? `Discount: normally ${money(it.price)} each` : ""}</p>
    </div>`; }).join("");
  $("#saleTotal").textContent = money(saleLines.reduce((a, l) => a + linePrice(l) * (l.qty || 0), 0));
}
$("#saleLines").addEventListener("input", e => {
  const el = e.target.closest("[data-f]"); if (!el) return;
  const l = saleLines[+el.dataset.i], f = el.dataset.f;
  if (f === "qty") l.qty = Math.max(1, Math.min(50, Math.floor(+el.value) || 1));
  else l[f] = el.value;
  if (f === "id" || f === "side"){ if (f === "id"){ const it = l.id === "custom" ? null : itemOf(l); l.side = it && it.variants ? Object.keys(it.variants)[0] : ""; delete l.price; } renderLines(); }
  else {
    // update this line's amount and discount note without redrawing (keeps typing smooth)
    const i = +el.dataset.i, it = l.id === "custom" ? null : itemOf(l), off = !!it && linePrice(l) !== it.price;
    document.querySelector(`[data-amt="${i}"]`).textContent = money(linePrice(l) * l.qty);
    const was = document.querySelector(`[data-was="${i}"]`); if (was) was.hidden = !off;
    const pin = document.querySelector(`[data-f="price"][data-i="${i}"]`); if (pin) pin.classList.toggle("off", off);
    $("#saleTotal").textContent = money(saleLines.reduce((a, x) => a + linePrice(x) * (x.qty || 0), 0));
  }
});
$("#saleLines").addEventListener("click", e => { const x = e.target.closest("[data-x]"); if (x){ saleLines.splice(+x.dataset.x, 1); renderLines(); } });
$("#addLine").addEventListener("click", () => { saleLines.push({ id: catalog[0].id, side: "pretty", qty: 1 }); renderLines(); });
$("#addSale").addEventListener("click", openSale);
$("#cancelSale").addEventListener("click", () => { $("#sale").hidden = true; });
$("#sale").addEventListener("submit", async e => {
  e.preventDefault();
  const items = saleLines.map(l => l.id === "custom" ? { custom: true, name: (l.name || "").trim(), price: linePrice(l), qty: l.qty } : { id: l.id, side: l.side, qty: l.qty, price: linePrice(l) });
  const b = $("#saveSale"); b.disabled = true; b.textContent = "Saving…"; $("#saleErr").hidden = true;
  try {
    const r = await fetch(MANUAL_URL, { method: "POST", headers: { "Content-Type": "application/json", "X-Admin-Key": pw },
      body: JSON.stringify({ name: $("#saleName").value, method: $("#saleMethod").value, note: $("#saleNote").value, items }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "The sale didn't save. Try again.");
    done.add(d.order.order); store.set("pk-admin-done", [...done]);   // sold at the stand, so it's already picked up
    ordered.add(d.order.order); store.set("pk-admin-ordered", [...ordered]);
    $("#sale").hidden = true; load();
  } catch(err){ $("#saleErr").textContent = err.message; $("#saleErr").hidden = false; }
  finally { b.disabled = false; b.textContent = "Save sale"; }
});
// remove a sale (tap twice)
$("#orders").addEventListener("click", async e => {
  const b = e.target.closest("[data-rm]"); if (!b) return;
  if (b.dataset.sure !== "1"){ b.dataset.sure = "1"; b.textContent = "Tap again to remove"; return; }
  b.disabled = true; b.textContent = "Removing…";
  try {
    const r = await fetch(`${MANUAL_URL}?id=${encodeURIComponent(b.dataset.rm)}`, { method: "DELETE", headers: { "X-Admin-Key": pw } });
    if (!r.ok) throw new Error();
    orders = orders.filter(o => o.id !== b.dataset.rm); render();
  } catch(err){ b.disabled = false; b.textContent = "Couldn't remove. Try again"; }
});

$("#login").addEventListener("submit", e => { e.preventDefault(); pw = $("#pw").value.trim(); store.set("pk-admin-pw", pw); $("#loginErr").hidden = true; start(); });
$("#logout").addEventListener("click", () => logout());
$("#refresh").addEventListener("click", load);
$("#search").addEventListener("input", render);
$("#hideDone").addEventListener("change", render);
$("#orders").addEventListener("change", e => {
  const ob = e.target.closest("[data-ordered]");
  if (ob){ ob.checked ? ordered.add(ob.dataset.ordered) : ordered.delete(ob.dataset.ordered); store.set("pk-admin-ordered", [...ordered]); render(); return; }
  const box = e.target.closest("[data-done]"); if (!box) return;
  box.checked ? done.add(box.dataset.done) : done.delete(box.dataset.done);
  store.set("pk-admin-done", [...done]); render();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) document.title = "Shop Orders"; });
if (pw) start();
</script>
</body>
</html>
