<!DOCTYPE html>
<html lang="en" data-side="killer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Video Pack · Killer ver.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:wght@700;900&family=Special+Elite&family=IBM+Plex+Mono:wght@400;600&family=Karla:wght@400;600;800&display=swap">
<style>
/* Pretty Killer digital item page, one version per page. Pretty = pink, Killer = black. */
:root{
  --ground:#f8d2e1; --surface:#fffafc; --ink:#161015; --muted:#8e5a73;
  --accent:#f25fc4; --accent-ink:#161015; --line:#e9b1c9;
  --display:"Bodoni Moda","Didot",Georgia,serif;
  --body:"Karla",system-ui,sans-serif;
  --mono:"Special Elite","Courier New",monospace;
  --radius:3px; --shadow:0 18px 28px -14px rgba(120,30,75,.45);
  color-scheme:light;
}
:root[data-side="killer"]{
  --ground:#09080a; --surface:#141216; --ink:#f2ecf0; --muted:#8c8390;
  --accent:#ff3fae; --accent-ink:#0a0a0a; --line:#2c272f;
  --display:"Anton","Impact",sans-serif;
  --body:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --radius:0px; --shadow:6px 6px 0 0 #ff3fae;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:16px/1.5 var(--body);min-height:100vh;transition:background .3s,color .3s}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 56px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.bar b{font:900 20px/1 var(--display)}
[data-side="killer"] .bar b{font-weight:400;text-transform:uppercase;letter-spacing:.04em}
.bar span{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.eyebrow{font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
h1{margin:8px 0 6px;font:900 clamp(40px,10vw,84px)/.95 var(--display)}
[data-side="killer"] h1{font-weight:400;text-transform:uppercase;color:var(--accent)}
.sub{margin:0 0 20px;max-width:56ch;font-size:17px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{font:600 14px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:12px 18px;min-height:44px;border:2px solid;cursor:pointer;border-radius:var(--radius)}
.tab[data-v="pretty"]{background:#fffafc;color:#161015;border-color:#e9b1c9}
.tab[data-v="killer"]{background:#0b0a0c;color:#ff3fae;border-color:#2c272f}
.tab[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent);border-color:var(--accent)}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:18px}
.card .media{background:#000;aspect-ratio:16/9;display:grid;place-items:center;color:#8c8390;font:600 14px var(--mono);text-transform:uppercase;letter-spacing:.1em}
.card video{display:block;width:100%;height:100%;background:#000}
.card .body{padding:14px 18px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.card h2{margin:0;font:900 24px/1.15 var(--display)}
[data-side="killer"] .card h2{font-weight:400;text-transform:uppercase;letter-spacing:.03em}
.card p{margin:2px 0 0;color:var(--muted);font-size:14px}
.dl{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font:600 13px var(--mono);text-transform:uppercase;letter-spacing:.08em;border-radius:var(--radius)}
.soon{font:600 13px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.tracks{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 0}
.trk{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.trk:last-child{border-bottom:0}
.trk .no{font:600 12px var(--mono);color:var(--muted)}
.trk .nm{font-weight:800;min-width:0;overflow-wrap:anywhere}
.trk .nm.tba{font-weight:400;font-style:italic;opacity:.5}
.trk .act{display:flex;gap:8px;align-items:center}
.play{min-width:44px;min-height:44px;border-radius:50%;border:1.5px solid var(--accent);background:none;color:var(--accent);cursor:pointer;font-size:16px}
.play.on{background:var(--accent);color:var(--accent-ink)}
.trk .dl{min-height:40px;padding:8px 12px}
.foot{margin-top:24px;font:12px var(--mono);color:var(--muted)}
@media (max-width:560px){ .trk{grid-template-columns:26px 1fr} .trk .act{grid-column:1/-1;justify-content:flex-end} }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar"><b>Finn Shapiro</b><span>Pretty Killer Tour</span></header>
  <span class="eyebrow">Your digital item</span>
  <h1>Video Pack</h1>
  <span class="eyebrow">Killer ver.</span>
  <p class="sub">PK: the music video, the dance practice and the behind the scenes.</p>
  <div id="videos"></div>
  <p class="foot">Thank you for supporting the Pretty Killer Tour. ♡ Finn</p>
</div>
<script>
/* THE VIDEOS, per version. Put the files in media/video-pack-798d0979/<pretty or killer>/.
   A video without its file says "Coming soon". */
const DIR = "media/video-pack-798d0979/";
const PACK = {
  pretty: { song:"Worked", videos:[
    { title:"Worked · Music Video",                 file:"pretty/music-video.mp4" },
    { title:"Worked · Dance Practice",              file:"pretty/dance-practice.mp4" },
    { title:"Worked · Music Video Behind the Scenes", file:"pretty/behind-the-scenes.mp4" } ] },
  killer: { song:"PK", videos:[
    { title:"PK · Music Video",                     file:"killer/music-video.mp4" },
    { title:"PK · Dance Practice",                  file:"killer/dance-practice.mp4" },
    { title:"PK · Music Video Behind the Scenes",   file:"killer/behind-the-scenes.mp4" } ] }
};

const $ = s => document.querySelector(s);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
const slug = n => String(n).toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const exists = {};   // file -> true / false
const check = f => f in exists ? Promise.resolve(exists[f])
  : fetch(f, { method:"HEAD", cache:"no-store" }).then(r => exists[f] = r.ok).catch(() => exists[f] = false);
// the version tab starts on the side of the clock (Pretty in the morning, Killer at night)
const v = "killer";   // this page is the Killer version
function setTabs(){
  document.documentElement.dataset.side = v;
  document.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
}

function render(){
  setTabs();
  const list = PACK[v].videos;
  Promise.all(list.map(x => check(DIR + x.file))).then(oks => {
    $("#videos").innerHTML = list.map((x, i) => `<div class="card">
      <div class="media">${oks[i] ? `<video src="${esc(DIR + x.file)}" controls playsinline preload="metadata"></video>` : "Coming soon"}</div>
      <div class="body"><h2>${esc(x.title)}</h2>${oks[i] ? `<a class="dl" href="${esc(DIR + x.file)}" download="${esc(x.title)}.mp4">⬇ Download</a>` : `<span class="soon">Coming soon</span>`}</div>
    </div>`).join("");
  });
}
render();
</script>
</body>
</html>
